name: gate

# The doctrine in harnessing says instruction is not enforcement: a rule you have to
# remember and a rule that auto-loads are both instruction, and both get skipped. The
# only thing that guarantees anything is a deterministic check at a boundary that does
# not depend on anyone remembering.
#
# This repository was published without one, which made that section a claim rather
# than a practice. These are its teeth. They run with no agent session present, which
# is the whole point.
#
# A red run does not block a merge on its own. It blocks only once it is a required
# status check in branch protection, which is repository configuration and not
# workflow configuration.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the leak check reads every commit message, not just the tip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Documentation lint
        run: python devaing/scripts/gate/doc_lint.py

      - name: devaing skill integrity
        working-directory: devaing
        run: python scripts/check_integrity.py

      - name: harnessing installer is runnable
        run: python harnessing/install.py --help

      - name: Manifests parse and every plugin source resolves
        run: |
          python - <<'EOF'
          import json, sys, pathlib
          bad = []
          for p in [".claude-plugin/marketplace.json",
                    "harnessing/.claude-plugin/plugin.json",
                    "devaing/.claude-plugin/plugin.json",
                    "brainia/.claude-plugin/plugin.json",
                    "brainia/marketplace-entry.json"]:
              try:
                  json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          m = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          for plugin in m["plugins"]:
              src = plugin["source"].lstrip("./")
              if not pathlib.Path(src).is_dir():
                  bad.append(f"marketplace names {plugin['name']} at {src}, which is not a directory")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"manifests OK: {len(m['plugins'])} plugins, every source resolves")
          EOF

      - name: brainia agent surfaces stay in parity
        # brainia ships the same skills to Claude, Gemini and Kiro, in progressively
        # reduced adaptations rather than copies. That is three surfaces to keep in
        # step, and it is where silent drift shows up first. The validator already
        # existed and only ran when someone remembered to run it, which by this stack's
        # own definition is instruction rather than enforcement.
        run: bash brainia/scripts/validate-agent-surface.sh

      - name: brainia adaptations were reviewed after their source changed
        # Name parity says the same skills exist everywhere. It does not say the Gemini
        # and Kiro versions still describe what the Claude one does. A diff cannot
        # settle that either, because the adaptations are deliberately shorter. What can
        # be settled is whether anyone looked: each one records the hash of the source
        # it was ported from, and this fails when a source moved on without a review.
        run: python brainia/scripts/check_surface_provenance.py

      - name: Context footprint stays honest
        # A framework about the economy of context has to account for its own. These are
        # the numbers published in harnessing/README.md, checked so the claim cannot
        # quietly stop being true.
        run: |
          python - <<'EOF'
          import pathlib, sys
          import glob, re
          limits = {"harnessing/doctrine/condensed.md": 800,
                    "harnessing/doctrine/universal.md": 3200,
                    "devaing/DOCTRINE.md": 2000}
          bad = []
          for f, cap in limits.items():
              n = len(pathlib.Path(f).read_text(encoding="utf-8").split())
              print(f"{f}: {n} words (cap {cap})")
              if n > cap:
                  bad.append(f"{f} is {n} words, over its published cap of {cap}")

          # Every installed skill's name and description sits in the system prompt of
          # every session, because that is how an agent knows the skill exists. It is
          # resident whether or not the skill ever fires, so it is part of the standing
          # cost and the first version of this check missed it entirely.
          def announced(path):
              t = pathlib.Path(path).read_text(encoding="utf-8", errors="replace")
              if not t.startswith("---"):
                  return 0
              block = t.split("---", 2)[1]
              words = 0
              for key in ("name", "description"):
                  m = re.search(rf'^{key}:\s*(.*)$', block, re.M)
                  if m:
                      words += len(m.group(1).strip().strip('"').split())
              return words

          surfaces = {"harnessing": "harnessing/skills/*/SKILL.md",
                      "devaing": "devaing/skills/*/SKILL.md",
                      "brainia": "brainia/.claude/skills/*/SKILL.md",
                      "brainia agents": "brainia/.claude/agents/*.md"}
          total = 0
          for label, pattern in surfaces.items():
              files = glob.glob(pattern)
              n = sum(announced(f) for f in files)
              total += n
              print(f"{label}: {n} words announced across {len(files)} entries")
          CAP = 1000
          print(f"announced total: {total} words (cap {CAP})")
          if total > CAP:
              bad.append(f"skill names and descriptions total {total} words, over the "
                         f"published cap of {CAP}. That is resident in every session.")
          if bad:
              for b in bad:
                  print(b)
              sys.exit(1)
          EOF

      - name: No byte order marks
        run: |
          python - <<'EOF'
          import pathlib, subprocess, sys
          # A BOM before YAML frontmatter makes a skill unparseable, and the parser that
          # trips over it says nothing useful about why. PowerShell cmdlets write UTF-8
          # with a BOM by default, so this comes back unless something watches for it.
          bad = [f for f in subprocess.run(["git","ls-files"], capture_output=True, text=True).stdout.split()
                 if pathlib.Path(f).is_file() and pathlib.Path(f).read_bytes().startswith(b"\xef\xbb\xbf")]
          if bad:
              print("byte order mark at the start of:"); print("\n".join(bad)); sys.exit(1)
          print("no byte order marks")
          EOF

      - name: Nothing private reaches a public repo
        env:
          # A comma-separated list of strings that must never appear here: client names,
          # machine paths, a personal instance folder. It lives in a repository secret
          # rather than in this file, because a public repository cannot carry the list
          # of private names it is meant to keep out. The list would be the leak.
          #
          # Set it under Settings, Secrets and variables, Actions. Unset, this step
          # reports that it is unconfigured and passes, so a fork is never blocked by
          # someone else's list.
          FORBIDDEN: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          python - <<'EOF'
          import os, pathlib, subprocess, sys
          names = [n.strip() for n in os.environ.get("FORBIDDEN", "").split(",") if n.strip()]
          if not names:
              print("FORBIDDEN_STRINGS is not set, so there is nothing to check against.")
              print("Set it if this repository must never mention certain names or paths.")
              sys.exit(0)

          bad = []
          files = subprocess.run(["git","ls-files"], capture_output=True, text=True).stdout.split()
          for f in files:
              p = pathlib.Path(f)
              if not p.is_file():
                  continue
              try:
                  text = p.read_bytes().decode("utf-8")
              except UnicodeDecodeError:
                  continue
              for n in names:
                  if n in text:
                      bad.append(f"{f} mentions a forbidden string")

          # Commit messages are the half that gets forgotten. Checking only files once
          # let five of them through, and an outside reader found them after publishing.
          log = subprocess.run(["git","log","--format=%s%n%b"],
                               capture_output=True, text=True, encoding="utf-8").stdout
          for n in names:
              if n in log:
                  bad.append("a commit message mentions a forbidden string")

          if bad:
              # Deliberately not printing which string matched: this output is public.
              print("\n".join(sorted(set(bad)))); sys.exit(1)
          print(f"clean: {len(files)} tracked files and every commit message, "
                f"against {len(names)} forbidden strings")
          EOF
